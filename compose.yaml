name: linkvault
services:
  app:
    build: .
    image: linkvault:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
    volumes:
      - files:/data
    expose: ["8000"]
    networks: [frontend, backend]
    depends_on:
      db: {condition: service_healthy}
      clamav: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  maintenance:
    image: linkvault:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
    command: ["python", "manage.py", "housekeeping", "--loop"]
    volumes: ["files:/data"]
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 50
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault -d linkvault"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - signatures:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [backend, updates]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 4g
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
networks:
  frontend:
  backend:
    internal: true
  updates:
volumes:
  files:
  database:
  signatures:
  certificates:
  caddy_config:
