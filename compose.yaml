name: linkvault
services:
  app:
    build: .
    image: ${LINKVAULT_IMAGE:-linkvault:local}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
      PREVIEW_SOCKET: /run/linkvault-preview/render.sock
    volumes:
      - files:/data
      - preview_socket:/run/linkvault-preview:ro
    expose: ["8000"]
    networks: [frontend, backend]
    depends_on:
      db: {condition: service_healthy}
      clamav: {condition: service_healthy}
      preview: {condition: service_started}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  preview:
    image: ${LINKVAULT_IMAGE:-linkvault:local}
    restart: unless-stopped
    command: ["python", "scripts/preview_server.py", "/run/linkvault-preview/render.sock"]
    network_mode: none
    read_only: true
    volumes: ["preview_socket:/run/linkvault-preview"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=96m,uid=10001,gid=10001,mode=700"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    pids_limit: 32
  maintenance:
    image: ${LINKVAULT_IMAGE:-linkvault:local}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
    command: ["python", "manage.py", "housekeeping", "--loop"]
    volumes: ["files:/data"]
    networks: [backend, updates]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 50
  webhooks:
    image: ${LINKVAULT_IMAGE:-linkvault:local}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
    command: ["python", "manage.py", "deliver_webhooks", "--loop", "--workers", "2"]
    tmpfs: ["/data:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=700"]
    networks: [backend, updates]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
  mail:
    image: ${LINKVAULT_IMAGE:-linkvault:local}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      DATA_DIR: /data
    command: ["python", "manage.py", "deliver_mail", "--loop", "--workers", "2"]
    tmpfs: ["/data:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=700"]
    networks: [backend, updates]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
  db:
    image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkvault
      POSTGRES_USER: linkvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault -d linkvault"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  clamav:
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    restart: unless-stopped
    volumes:
      - signatures:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [backend, updates]
    healthcheck:
      # Match clamd's IPv4 listener; localhost may resolve to IPv6 first.
      test: ["CMD-SHELL", "printf 'nPING\\n' | nc -w 5 127.0.0.1 3310 | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 4g
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
networks:
  frontend:
  backend:
    internal: true
  updates:
volumes:
  preview_socket:
  files:
  database:
  signatures:
  certificates:
  caddy_config:
