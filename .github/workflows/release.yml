name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and application versions differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Test the exact image selected for publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=192m,uid=10001,gid=10001,mode=700 \
            -e DEBUG=true -e DATA_DIR=/tmp/data -e APP_URL=http://localhost \
            -e SECRET_KEY=release-test-only-secret-with-at-least-sixty-four-characters-000000 \
            -e ANTIVIRUS_REQUIRED=false --entrypoint timeout "$IMAGE@$DIGEST" \
            120 /app/.venv/bin/python manage.py test --noinput
      - name: Export portable Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p dist digests
          docker tag "$IMAGE@$DIGEST" "linkvault:$VERSION"
          docker save "linkvault:$VERSION" | gzip > "dist/linkvault-$VERSION-linux-$ARCH.tar.gz"
          printf '%s\n' "$DIGEST" > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Assemble tested image digests
        id: index
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          image, version = os.environ['IMAGE'], os.environ['RELEASE_TAG'][1:]
          sources = []
          for arch in ('amd64', 'arm64'):
              digest = pathlib.Path(f'digests/{arch}.txt').read_text().strip()
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Invalid build digest'
              sources.append(f'{image}@{digest}')
          subprocess.run(['docker', 'buildx', 'imagetools', 'create', '--metadata-file', 'dist/index.json', '-t', f'{image}:{version}', '-t', f'{image}:latest', *sources], check=True)
          digest = json.loads(pathlib.Path('dist/index.json').read_text())['containerimage.descriptor']['digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
          pathlib.Path('dist/IMAGE-DIGEST.txt').write_text(image + '@' + digest + '\n')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          python3 scripts/release_notes.py > dist/notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "Liasio $VERSION" --notes-file dist/notes.md dist/*.tar.gz dist/SHA256SUMS dist/IMAGE-DIGEST.txt
