name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkvault
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkvault -d linkvault"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
      - run: python3 scripts/configure.py --dev
      - run: uv sync --frozen
      - run: uv run --env-file .env python manage.py collectstatic --noinput
      - run: uv run --env-file .env python manage.py test --noinput
      - run: uv run --env-file .env python manage.py makemigrations --check --dry-run
      - run: uv run --env-file .env pip-audit --local --progress-spinner off
      - run: uv run bandit -r vault linkvault -x vault/tests,vault/migrations -ll
      - run: node --check static/app.js && node --check static/upload.js
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/configure.py --domain files.example.com
      - run: docker compose config --quiet
      - run: docker compose build app
      - run: docker compose up -d --wait --wait-timeout 600 db clamav app
      - run: docker compose exec -T app python manage.py check --deploy --fail-level ERROR
      - run: docker compose exec -T -e RUN_CLAMAV_INTEGRATION=1 app python manage.py test vault.tests.test_antivirus_live --noinput
      - run: docker compose exec -T -e DEBUG=true -e ANTIVIRUS_REQUIRED=false -e CLAMAV_HOST= -e DEMO_PASSWORD=Disposable-backup-fixture-2026! app python manage.py seed_demo
      - run: docker compose exec -T app python scripts/load_test.py --database postgres --workers 4 --mib 256 --output /tmp/load-report.json
      - run: mkdir -p .local && docker compose cp app:/tmp/load-report.json .local/load-report-postgres-clamav.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-report-postgres-clamav
          path: .local/load-report-postgres-clamav.json
      - run: scripts/backup-and-verify.sh
      - run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: failure()
        run: |
          docker compose logs --tail=120
          docker compose ps -q clamav | xargs -r docker inspect --format '{{json .State.Health}}'
      - if: always()
        run: docker compose down --volumes
