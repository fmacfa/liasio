name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: linkvault
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkvault -d linkvault"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
      - run: python3 scripts/configure.py --dev
      - run: uv sync --frozen
      - run: uv run ruff check vault linkvault scripts && uv run ruff format --check vault linkvault scripts
      - run: uv run --env-file .env python manage.py collectstatic --noinput
      - run: uv run --env-file .env python manage.py test --noinput
      - run: uv run python scripts/check_documentation.py
      - run: uv run --env-file .env python manage.py makemigrations --check --dry-run
      - run: uv run --env-file .env pip-audit --local --progress-spinner off
      - run: uv run bandit -r vault linkvault -x vault/tests,vault/migrations -ll
      - run: node --check static/app.js && node --check static/upload.js && node --check static/previews.js && node --check static/setup.js && node --check static/branding.js && node --check static/upload-core.js && node --check static/batches.js
      - run: node --test scripts/tests/*.test.cjs
      - run: node --check static/api-explorer.js
      - name: Browser regressions (desktop, mobile and interrupted upload)
        if: matrix.database == 'sqlite'
        run: |
          uv run playwright install --with-deps chromium
          uv run --env-file .env python manage.py test scripts.browser_tests --noinput
      - name: Encrypted backup round-trip (disposable local restic repository)
        if: matrix.database == 'sqlite'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
          python3 scripts/tests/test_offsite_backup.py
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/configure.py --domain files.example.com
      - run: docker compose config --quiet
      - run: docker compose build app
      - name: Test runtime image without development packages or startup preparation
        run: |
          built_image="$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["app"]["image"])')"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=192m,uid=10001,gid=10001,mode=700 \
            -e DEBUG=true -e DATA_DIR=/tmp/data -e APP_URL=http://localhost \
            -e SECRET_KEY=ci-runtime-test-only-secret-with-at-least-sixty-four-characters-000000 \
            -e ANTIVIRUS_REQUIRED=false --entrypoint timeout "$built_image" \
            120 /app/.venv/bin/python manage.py test --noinput
      - run: docker compose up -d --wait --wait-timeout 600 db clamav app webhooks mail
      - run: docker compose exec -T app python manage.py check --deploy --fail-level ERROR
      - name: Verify packaged guides and screenshots
        run: docker compose exec -T app python manage.py test vault.tests.test_localization --noinput
      - name: Verify background worker heartbeats
        run: |
          docker compose exec -T app python manage.py shell <<'PY'
          import time
          from datetime import timedelta
          from django.utils import timezone
          from vault.models import ServiceState
          for worker in ('webhooks', 'mail'):
              deadline = time.monotonic() + 30
              while not ServiceState.objects.filter(key=worker, updated_at__gte=timezone.now() - timedelta(minutes=1)).exists():
                  assert time.monotonic() < deadline, f'{worker} worker did not start'
                  time.sleep(1)
          PY
      - run: docker compose exec -T -e RUN_CLAMAV_INTEGRATION=1 app python manage.py test vault.tests.test_antivirus_live --noinput
      - run: docker compose exec -T -e RUN_PREVIEW_INTEGRATION=1 app python manage.py test vault.tests.test_previews.LiveRendererTests --noinput
      - name: Check renderer isolation
        run: |
          docker compose ps -q preview | xargs docker inspect > /tmp/preview-container.json
          python3 - <<'PY'
          import json
          container = json.load(open('/tmp/preview-container.json'))[0]
          host = container['HostConfig']
          assert host['NetworkMode'] == 'none'
          assert host['ReadonlyRootfs']
          assert host['Memory'] == 512 * 1024**2
          assert host['CapDrop'] == ['ALL']
          assert container['Config']['User'] == '10001:10001'
          assert {m['Destination'] for m in container['Mounts'] if m['Type'] != 'tmpfs'} == {'/run/linkvault-preview'}
          assert '/tmp' in host['Tmpfs'] and 'noexec' in host['Tmpfs']['/tmp']
          assert not any(e.startswith(('SECRET_KEY=', 'POSTGRES_PASSWORD=', 'MFA_ENCRYPTION_KEY=')) for e in container['Config']['Env'])
          PY
      - run: docker compose exec -T -e DEBUG=true -e ANTIVIRUS_REQUIRED=false -e CLAMAV_HOST= -e DEMO_PASSWORD=Disposable-backup-fixture-2026! app python manage.py seed_demo
      - run: docker compose exec -T app python scripts/load_test.py --database postgres --workers 4 --mib 256 --output /tmp/load-report.json
      - run: mkdir -p .local && docker compose cp app:/tmp/load-report.json .local/load-report-postgres-clamav.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-report-postgres-clamav
          path: .local/load-report-postgres-clamav.json
      - run: scripts/backup-and-verify.sh
      - run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: failure()
        run: |
          docker compose logs --tail=120
          docker compose ps -q clamav | xargs -r docker inspect --format '{{json .State.Health}}'
      - if: always()
        run: docker compose down --volumes
