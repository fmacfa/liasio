[project]
name = "linkvault"
version = "0.1.0"
description = "Self-hosted file collections, beautiful share pages, and controlled download links."
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "Django>=5.2.17,<5.3",
  "argon2-cffi>=25.1.0,<26",
  "gunicorn>=23.0.0,<24",
  "whitenoise>=6.11.0,<7",
  "psycopg[binary]>=3.2.10,<4",
]

[dependency-groups]
dev = ["pip-audit>=2.9.0,<3"]

[tool.uv]
package = false
