[project]
name = "linkvault"
version = "0.5.0"
description = "Self-hosted file collections, beautiful share pages, and controlled download links."
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "Django>=5.2.17,<5.3",
  "argon2-cffi>=25.1.0,<26",
  "gunicorn>=23.0.0,<24",
  "whitenoise>=6.11.0,<7",
  "psycopg[binary]>=3.2.10,<4",
  "pyotp>=2.9,<3",
  "cryptography>=50,<51",
  "segno>=1.6,<2",
  "pillow>=13,<14",
  "pypdfium2>=5.14,<6",
  "markdown-it-py>=4,<5",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "django-storages[s3]>=1.14.6,<2",
  "authlib>=1.6,<2",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "moto[s3]>=5,<6",
    "openapi-spec-validator>=0.7,<1",
    "pip-audit>=2.9.0,<3",
    "playwright>=1.56,<2",
    "polib>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".local", "vault/migrations"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
