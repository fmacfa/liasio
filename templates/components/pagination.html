{% load i18n %}
{% if page.has_other_pages %}
  <nav class="pagination" aria-label="{% translate "Pagination" %}">
    {% if page.has_previous %}
      <a class="button secondary"
         href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;link={{ link_id|urlencode }}&amp;sort={{ sort|urlencode }}">{% translate "Précédent" %}</a>
    {% endif %}
    <span>{% translate "Page" %} {{ page.number }} {% translate "sur" %} {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="button secondary"
         href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;link={{ link_id|urlencode }}&amp;sort={{ sort|urlencode }}">{% translate "Suivant" %}</a>
    {% endif %}
  </nav>
{% endif %}
