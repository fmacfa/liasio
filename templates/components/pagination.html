{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page.has_previous %}
      <a class="button secondary"
         href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;link={{ link_id|urlencode }}&amp;sort={{ sort|urlencode }}">Précédent</a>
    {% endif %}
    <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="button secondary"
         href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;link={{ link_id|urlencode }}&amp;sort={{ sort|urlencode }}">Suivant</a>
    {% endif %}
  </nav>
{% endif %}
