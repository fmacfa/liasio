<svg class="icon"
     width="20"
     height="20"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.7"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true">
  {% if name == "grid" %}
    <rect x="3" y="3" width="7" height="7" rx="1.5" />
    <rect x="14" y="3" width="7" height="7" rx="1.5" />
    <rect x="3" y="14" width="7" height="7" rx="1.5" />
    <rect x="14" y="14" width="7" height="7" rx="1.5" />
  {% elif name == "folder" %}
    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
  {% elif name == "link" %}
    <path d="m10 13 4-4m-6 6-2 2a4 4 0 0 0 6 5l3-3a4 4 0 0 0 0-6M9 11a4 4 0 0 1 0-6l3-3a4 4 0 0 1 6 5l-2 2" transform="translate(1 0) scale(.95)" />
  {% elif name == "activity" %}
    <path d="M3 12h4l3-8 4 16 3-8h4" />
  {% elif name == "palette" %}
    <circle cx="12" cy="12" r="9" />
    <path d="m6 14 6-6 6 6M8 16l4-4 4 4" />
  {% elif name == "users" %}
    <circle cx="9" cy="8" r="3" />
    <path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v2" />
  {% elif name == "shield" %}
    <path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6Z" />
    <path d="m8 12 3 3 5-5" />
  {% elif name == "arrow" %}
    <path d="M5 12h14m-6-6 6 6-6 6" />
  {% elif name == "download" %}
    <path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4" />
  {% elif name == "upload" %}
    <path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4" />
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14" />
  {% elif name == "copy" %}
    <rect x="8" y="8" width="12" height="13" rx="2" />
    <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
  {% elif name == "eye" %}
    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
    <circle cx="12" cy="12" r="3" />
  {% elif name == "lock" %}
    <rect x="5" y="10" width="14" height="11" rx="2" />
    <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" />
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
  {% elif name == "file" %}
    <path d="M13 2H5v20h14V8Zm0 0v6h6M8 13h8m-8 4h5" />
  {% elif name == "search" %}
    <circle cx="10" cy="10" r="6" />
    <path d="m15 15 6 6" />
  {% elif name == "logout" %}
    <path d="M9 3H4v18h5m-1-9h13m-5-5 5 5-5 5" />
  {% elif name == "check" %}
    <path d="m5 12 4 4L19 6" />
  {% elif name == "settings" %}
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2" />
  {% elif name == "storage" %}
    <ellipse cx="12" cy="5" rx="8" ry="3" />
    <path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0" />
  {% else %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 11v6m0-10h.01" />
  {% endif %}
</svg>
