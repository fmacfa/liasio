{% load i18n %}{% get_current_language as current_language %}{% get_available_languages as available_languages %}
<form method="post" action="{% url 'set_language' %}" class="language-picker" aria-label="{% translate 'Langue' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for code, name in available_languages %}
    <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" aria-label="{{ name }}" aria-pressed="{% if current_language == code %}true{% else %}false{% endif %}">{{ code|upper }}</button>
  {% endfor %}
</form>
